<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TRI-COMP | Multi-Band Mastering</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="rack-mount">
      <header>
        <div class="brand">TRI-COMP <span>MASTERING</span></div>
        <div c6lass="bypass-switch">
          <input type="checkbox" id="bypass" />
          <label for="bypass">ACTIVE</label>
        </div>
      </header>

      <div class="band-container">
        <div class="band low">
          <div class="band-header">LOW ( < 200Hz )</div>
          <div class="meter-box"><div class="reduction" id="gr-low"></div></div>
          <div class="knob-group">
            <label>THRESH</label>
            <input type="range" id="low-thresh" min="-60" max="0" value="-24" />
            <label>RATIO</label>
            <input type="range" id="low-ratio" min="1" max="20" value="4" />
          </div>
        </div>

        <div class="band mid">
          <div class="band-header">MID ( 200 - 2.5k )</div>
          <div class="meter-box"><div class="reduction" id="gr-mid"></div></div>
          <div class="knob-group">
            <label>THRESH</label>
            <input type="range" id="mid-thresh" min="-60" max="0" value="-12" />
            <label>RATIO</label>
            <input type="range" id="mid-ratio" min="1" max="20" value="2" />
          </div>
        </div>

        <div class="band high">
          <div class="band-header">HIGH ( > 2.5kHz )</div>
          <div class="meter-box">
            <div class="reduction" id="gr-high"></div>
          </div>
          <div class="knob-group">
            <label>THRESH</label>
            <input
              type="range"
              id="high-thresh"
              min="-60"
              max="0"
              value="-20"
            />
            <label>RATIO</label>
            <input type="range" id="high-ratio" min="1" max="20" value="4" />
          </div>
        </div>
      </div>

      <div class="master-section">
        <input type="file" id="audio-input" accept="audio/*" />
        <button id="play-btn">LOAD TRACK</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
